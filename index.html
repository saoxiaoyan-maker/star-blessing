 const arr=blessings[current]; let idx=Math.floor(Math.random()*arr.length);
 if(arr.length>1){while(idx===lastByCategory[current])idx=Math.floor(Math.random()*arr.length)}
 lastByCategory[current]=idx;
 message.textContent=arr[idx];
 number.textContent=`${meta[current].name} · 第 ${idx+1} 句 / ${arr.length} 句`;
 card.style.background=meta[current].color+"18";
 card.style.borderColor=meta[current].color+"70";
 document.getElementById("cardstar").textContent=meta[current].symbol;
 document.getElementById("cardstar").style.color=meta[current].color;
}
document.querySelectorAll(".tab").forEach(btn=>btn.addEventListener("click",()=>{
 current=btn.dataset.cat;
 document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("active",b===btn));
 drawStar();
}));
document.getElementById("draw").addEventListener("click",drawStar);
document.getElementById("again").addEventListener("click",drawStar);
drawStar();
</script></body></html>
